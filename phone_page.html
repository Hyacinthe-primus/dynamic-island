<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Dynamic Island</title>
<style>
  :root { --bg:#000; --card:#141414; --card2:#1f1f1f; --line:#2a2a2a; --text:#fff; --muted:#9a9a9a; --accent:#4cc2ff; --ok:#6ccb5f; --bad:#ff99a4; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; padding:16px 16px 40px; }
  header { display:flex; align-items:center; gap:12px; margin:4px 0 18px; }
  .pill { background:#000; border:1px solid var(--line); border-radius:9px; padding:8px 14px; display:flex; align-items:center; gap:10px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); }
  h1 { font-size:18px; margin:0; font-weight:600; }
  .sub { color:var(--muted); font-size:13px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  h2 { font-size:14px; margin:0 0 10px; font-weight:600; color:#ddd; }
  textarea, input[type=text] { width:100%; background:var(--card2); color:var(--text); border:1px solid var(--line); border-bottom:2px solid var(--accent); border-radius:6px; padding:10px; font:inherit; resize:vertical; }
  textarea { min-height:70px; }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  button, .btn { background:var(--card2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:10px 14px; font:inherit; font-weight:500; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  button.primary { background:var(--accent); color:#000; border-color:var(--accent); }
  button:active, .btn:active { transform:scale(.97); }
  .grow { flex:1; }
  .item { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .item:first-of-type { border-top:none; }
  .item .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:pre-wrap; word-break:break-word; max-height:6.5em; }
  .remote { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .remote button { padding:16px 0; font-size:20px; }
  .bar { height:4px; background:var(--card2); border-radius:2px; overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  .empty { color:var(--muted); font-size:13px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(80px); background:#000; border:1px solid var(--line); border-radius:9px; padding:10px 16px; transition:transform .25s; }
  #toast.on { transform:translateX(-50%) translateY(0); }
  label.file { display:block; text-align:center; padding:18px; border:1px dashed #444; border-radius:8px; color:var(--muted); }
  input[type=file] { display:none; }
  svg.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  h2 { display:flex; align-items:center; gap:8px; }
  h2 svg.i { color:var(--accent); }
  .remote svg.i { width:22px; height:22px; }
</style>
</head>
<body>
<header>
  <div class="pill"><span class="dot" id="dot"></span><b id="pc">PC</b></div>
  <div><h1>Dynamic Island</h1><div class="sub" id="status">Connecté au PC</div></div>
</header>

<section>
  <h2><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Envoyer au PC</h2>
  <textarea id="txt" placeholder="Texte, lien, code… (copié dans le presse-papiers du PC)"></textarea>
  <div class="row">
    <button class="primary grow" onclick="sendText()"><svg class="i" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7-7-1z"/></svg>Envoyer</button>
    <button class="grow" onclick="sendClipboard()"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/></svg>Mon presse-papiers</button>
  </div>
</section>

<section>
  <h2><svg class="i" viewBox="0 0 24 24"><path d="M4 13l3-8h10l3 8v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg>Reçu du PC</h2>
  <div id="inbox"><div class="empty">Rien pour l'instant. Depuis l'île : onglet Téléphone › « Envoyer au téléphone ».</div></div>
</section>

<section>
  <h2><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Fichiers du PC</h2>
  <div id="files"><div class="empty">Glissez des fichiers dans l'île pour les retrouver ici.</div></div>
</section>

<section>
  <h2><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>Envoyer des fichiers au PC</h2>
  <label class="file" for="up">Touchez pour choisir des photos ou fichiers</label>
  <input type="file" id="up" multiple onchange="upload(this.files)">
  <div id="uploads"></div>
</section>

<section>
  <h2><svg class="i" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="8" r="2"/><path d="M10 14h4M10 17h4"/></svg>Télécommande</h2>
  <div class="remote">
    <button onclick="remote('prev')" aria-label="Précédent"><svg class="i" viewBox="0 0 24 24"><path d="M6 5v14M19 5l-10 7 10 7z"/></svg></button>
    <button onclick="remote('play')" aria-label="Lecture / pause"><svg class="i" viewBox="0 0 24 24"><path d="M5 4l9 8-9 8z"/><path d="M16 5v14M20 5v14"/></svg></button>
    <button onclick="remote('next')" aria-label="Suivant"><svg class="i" viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7z"/></svg></button>
    <button onclick="remote('voldown')" aria-label="Volume moins"><svg class="i" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 12h5"/></svg></button>
    <button onclick="remote('mute')" aria-label="Couper le son"><svg class="i" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
    <button onclick="remote('volup')" aria-label="Volume plus"><svg class="i" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 12h6M19 9v6"/></svg></button>
    <button onclick="remote('left')" aria-label="Diapositive précédente"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button onclick="remote('space')" aria-label="Espace"><svg class="i" viewBox="0 0 24 24"><path d="M4 10v4h16v-4"/></svg></button>
    <button onclick="remote('right')" aria-label="Diapositive suivante"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="row">
    <input type="text" id="url" class="grow" placeholder="Ouvrir un lien sur le PC">
    <button onclick="openUrl()">Ouvrir</button>
  </div>
</section>

<div id="toast"></div>
<script>
const T = new URLSearchParams(location.search).get("t") || "";
const H = { "X-Token": T, "Content-Type": "application/json" };
let since = 0;
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const human = n => n < 1024 ? n + " o" : n < 1048576 ? (n/1024).toFixed(0) + " Ko" : n < 1073741824 ? (n/1048576).toFixed(1) + " Mo" : (n/1073741824).toFixed(2) + " Go";
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 1800); }
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: H, body: JSON.stringify(body || {}) });
  if (!r.ok) throw new Error(r.status);
}
async function state() {
  let b = {};
  try { if (navigator.getBattery) { const bat = await navigator.getBattery(); b = { battery: Math.round(bat.level * 100), charging: bat.charging };
    if (!bat._h) { bat._h = 1; bat.addEventListener("levelchange", state); bat.addEventListener("chargingchange", state); } } } catch (e) {}
  try { await post("/api/state", b); setOnline(true); } catch (e) { setOnline(false); }
}
function setOnline(on) {
  document.getElementById("dot").style.background = on ? "var(--ok)" : "var(--bad)";
  document.getElementById("status").textContent = on ? "Connecté au PC" : "PC injoignable — même Wi-Fi ?";
}
async function sendText() {
  const el = document.getElementById("txt"); if (!el.value.trim()) return;
  try { await post("/api/text", { text: el.value }); el.value = ""; toast("Copié sur le PC"); } catch (e) { toast("Échec de l'envoi"); }
}
async function sendClipboard() {
  try { const t = await navigator.clipboard.readText(); if (!t) return toast("Presse-papiers vide");
    await post("/api/text", { text: t }); toast("Presse-papiers envoyé"); }
  catch (e) { toast("Autorisez l'accès au presse-papiers"); }
}
async function copy(id) {
  const t = document.getElementById("m" + id).textContent;
  try { await navigator.clipboard.writeText(t); toast("Copié"); }
  catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById("m" + id));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texte sélectionné : copiez-le"); }
}
async function poll() {
  try {
    const r = await fetch("/api/poll?since=" + since, { headers: H }); const d = await r.json(); setOnline(true);
    document.getElementById("pc").textContent = d.pc;
    if (d.texts.length) {
      const box = document.getElementById("inbox"); if (box.querySelector(".empty")) box.innerHTML = "";
      for (const m of d.texts.slice().reverse()) {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<div class="t" id="m${m.id}">${esc(m.text)}</div><button onclick="copy('${m.id}')">Copier</button>`;
        box.prepend(div);
        if (/^https?:\/\//.test(m.text.trim())) { const a = document.createElement("a"); a.className = "btn"; a.href = m.text.trim(); a.target = "_blank"; a.textContent = "Ouvrir"; div.appendChild(a); }
      }
      since = Math.max(since, ...d.texts.map(m => m.ts));
      if (navigator.vibrate) navigator.vibrate(40);
    }
    const f = document.getElementById("files");
    f.innerHTML = d.files.length ? d.files.map(x => `<div class="item"><div class="t">${esc(x.name)}<div class="sub">${human(x.size)}</div></div><a class="btn" href="/f?i=${x.i}&t=${encodeURIComponent(T)}" download>Télécharger</a></div>`).join("")
      : '<div class="empty">Glissez des fichiers dans l\'île pour les retrouver ici.</div>';
  } catch (e) { setOnline(false); }
}
function upload(list) {
  for (const file of list) {
    const row = document.createElement("div"); row.className = "item";
    row.innerHTML = `<div class="t">${esc(file.name)}<div class="bar"><i></i></div></div>`;
    document.getElementById("uploads").prepend(row);
    const x = new XMLHttpRequest(); x.open("POST", "/api/upload?name=" + encodeURIComponent(file.name));
    x.setRequestHeader("X-Token", T);
    x.upload.onprogress = e => { if (e.lengthComputable) row.querySelector("i").style.width = (e.loaded / e.total * 100) + "%"; };
    x.onload = () => { row.querySelector("i").style.width = "100%"; row.querySelector("i").style.background = "var(--ok)"; toast("Reçu sur le PC"); };
    x.onerror = () => { row.querySelector("i").style.background = "var(--bad)"; toast("Échec : " + file.name); };
    x.send(file);
  }
  document.getElementById("up").value = "";
}
async function remote(a, arg) { try { await post("/api/remote", { a, arg }); if (navigator.vibrate) navigator.vibrate(15); } catch (e) { toast("PC injoignable"); } }
function openUrl() { const u = document.getElementById("url"); if (u.value.trim()) { remote("open", u.value.trim()); u.value = ""; toast("Ouvert sur le PC"); } }
state(); poll(); setInterval(poll, 2000); setInterval(state, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { state(); poll(); } });
</script>
</body>
</html>
